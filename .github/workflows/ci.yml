name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-evaluation-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install validation dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Validate sample evaluation report
        run: |
          python tools/validate_evaluation_report.py \
            schemas/evaluation-report.schema.json \
            examples/sample-evaluation-report.json

      - name: Run semantic validation tests
        run: python -m unittest discover -s tests -v
